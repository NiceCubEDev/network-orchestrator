[package]
name = "net-manager-macos-bridge"
version = "0.10.3"
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
net-manager-core = { path = "../core" }
net-manager-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
