[package]
name = "net-manager-engine"
version = "0.16.0"
edition.workspace = true

[features]
# Builds the Linux daemon client on other hosts so its callers can be tested there.
linux-engine = []

[dependencies]
base64 = "0.22"
ipnet = "2"
net-manager-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "process", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
reqwest = { version = "=0.13.5", features = ["stream", "socks"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"
