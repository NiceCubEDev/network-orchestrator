[package]
name = "net-manager-cli"
version = "0.0.0"
edition.workspace = true
description = "netorch: one command for VPN profiles, tunnels and routing"

[[bin]]
name = "netorch"
path = "src/main.rs"

[features]
default = []
# Compile the actual macOS parser/services on Unix for portable business tests.
macos-cli = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
net-manager-core = { path = "../core" }
net-manager-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
network-orchestrator-macos-helper = { path = "../macos-helper" }

[dev-dependencies]
net-manager-engine = { path = "../engine", features = ["linux-engine"] }
tempfile = "3"
